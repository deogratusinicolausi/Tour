name: turiva
description: "A new Flutter project."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  # UI & Icons
  cupertino_icons: ^1.0.8

  # Networking
  http: ^1.1.0
  local_auth: ^3.0.2
  flutter_screenutil: ^5.9.0

  # Firebase - Compatible Versions
  firebase_core: ^4.14.0
  cloud_firestore: ^6.9.0
  cloudinary_public: ^0.23.1
  firebase_auth: ^6.6.1
  firebase_core_web: ^2.15.0
  url_launcher: ^6.3.2

  # Other dependencies
  lottie: ^3.3.3

  # ⭐️ Notifications
  audioplayers: ^6.1.0
  vibration: ^3.1.0
  timeago: ^3.7.0

  # Image Caching
  cached_network_image: ^3.3.0
  curved_navigation_bar: ^1.0.6

  # Colors
  random_color: ^1.0.6-nullsafety

  # Page Indicators
  smooth_page_indicator: ^3.0.0

  # Device Info
  device_info_plus: ^13.2.0
  image_picker: ^1.2.3
  firebase_storage: ^13.5.0
  cloudinary_made_easy: ^0.1.2
  azampaytanzania: ^0.0.4
  cloud_functions: ^6.5.0
  google_maps_flutter: ^2.18.1
  shared_preferences: ^2.5.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/animations/
    - assets/fonts/
    - assets/sounds/

dependency_overrides:
  firebase_core_web: 3.10.0