name: turiva
description: "A new Flutter project."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  # UI & Icons
  cupertino_icons: ^1.0.8

  # Networking
  http: ^1.1.0
  local_auth: ^3.0.2
  flutter_screenutil: ^5.9.0

  # Firebase - Compatible Versions
  firebase_core: ^4.14.0
  firebase_auth: ^6.6.1
  firebase_core_web: ^2.15.0

  # Other dependencies
  lottie: ^3.3.3

  # Image Caching
  cached_network_image: ^3.3.0

  # Colors
  random_color: ^1.0.6-nullsafety

  # Page Indicators
  smooth_page_indicator: ^3.0.0

  # Device Info
  device_info_plus: ^13.2.0
  image_picker: ^1.2.3
  firebase_storage: ^13.5.0
dev_dependencies:
  flutter_test:
    sdk: flutter

  # Linting
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  # Assets folder
  assets:
    - assets/images/
    - assets/animations/
    - assets/fonts/

  # Fonts (if you have custom fonts)
  # fonts:
  #   - family: CustomFont
  #     fonts:
  #       - asset: assets/fonts/CustomFont-Regular.ttf
  #       - asset: assets/fonts/CustomFont-Bold.ttf
  #         weight: 700

# Firebase Web compatibility fix for Flutter 3.41.4
dependency_overrides:
  firebase_core_web: 3.10.0